name: matrix watch

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test matrix selftest leakscan

  watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/watch.py check > watch.out; echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - if: steps.check.outputs.code == '2'
        run: exit 1
      - if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh issue list --state open --search "matrix sources moved in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "matrix sources moved" --body-file watch.out
          fi
