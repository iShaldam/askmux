name: matrix watch

# tests on every push; weekly, re-check every cited issue and pinned source
# line and open an issue when one moved

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test matrix selftest leakscan

  watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/watch.py check > watch.out; echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - if: steps.check.outputs.code == '2'
        run: exit 1
      - if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh issue list --state open --search "matrix sources moved in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "matrix sources moved" --body-file watch.out
          fi
