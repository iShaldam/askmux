name: dependabot auto-merge

# dependabot's github actions bumps merge themselves (rebase) once test,
# install and zizmor pass on the pr. main has no branch protection, so this
# job waits for those checks itself instead of trusting gh pr merge --auto.
# nothing else auto-merges: other ecosystems and anyone who isn't dependabot
# get skipped

on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.package-ecosystem == 'github_actions'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          want="install=pass test=pass zizmor=pass"
          for _ in $(seq 80); do
            sleep 15
            # gh exits 8 while checks are pending; the json is still printed
            got="$(gh pr checks "$PR_URL" --json name,bucket --jq '
              [.[] | select(.name == "test" or .name == "install" or .name == "zizmor")]
              | group_by(.name) | map(.[0].name + "=" + ([.[].bucket] | unique | join(",")))
              | join(" ")' || true)"
            echo "checks: ${got:-none yet}"
            case "$got" in
              "$want") gh pr merge --rebase --match-head-commit "$HEAD_SHA" "$PR_URL"; exit ;;
              *fail*|*cancel*) echo "a check failed, leaving the pr open"; exit 1 ;;
            esac
          done
          echo "checks still pending after 20 minutes"; exit 1
